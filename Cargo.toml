[workspace]
resolver = "3"
members = [
    "crates/gmod-kv",
    "crates/gmod-fs",
    "crates/gmod-glua",
    "crates/gmod-lua",
    "crates/gmod-bsp",
    "crates/gmod-material",
    "crates/gmod-model",
    "crates/gmod-world",
    "crates/gmod-movement",
    "crates/gmod-net",
    "crates/gmod-physics",
    "crates/gmod-ui",
    "crates/gmod-audio",
    "crates/gmod-web",
    "crates/gmod-render",
    "crates/gmod-app",
    "tools/gmod-check",
]

[workspace.package]
version = "0.4.4"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/Falcon-9FT/openGMod"

[workspace.dependencies]
gmod-kv = { path = "crates/gmod-kv" }
gmod-fs = { path = "crates/gmod-fs" }
gmod-glua = { path = "crates/gmod-glua" }
gmod-lua = { path = "crates/gmod-lua" }
gmod-bsp = { path = "crates/gmod-bsp" }
gmod-material = { path = "crates/gmod-material" }
gmod-model = { path = "crates/gmod-model" }
gmod-world = { path = "crates/gmod-world" }
gmod-movement = { path = "crates/gmod-movement" }
gmod-net = { path = "crates/gmod-net" }
gmod-physics = { path = "crates/gmod-physics" }
gmod-ui = { path = "crates/gmod-ui" }
gmod-audio = { path = "crates/gmod-audio" }
gmod-web = { path = "crates/gmod-web" }
gmod-render = { path = "crates/gmod-render" }
# what crosses the network: types serialized, in postcard's compact format
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# LuaJIT 2.1, built from source with the crate
mlua = { version = "0.12.1", features = ["luajit", "vendored"] }
# SQLite for Lua's `sql`, built from source; `hooks` for the authorizer that keeps queries in their database
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "hooks"] }
# Lua's `HTTP`: rustls (ring), certificates checked by the system as a browser does (an antivirus
# that scans HTTPS adds its root there). Pinned exactly: the resolver that keeps requests off
# private networks uses ureq's `unversioned` API
ureq = { version = "=3.4.2", features = ["platform-verifier"] }
# the network's keys and seals: X25519, Ed25519, HKDF-SHA256 and ChaCha20-Poly1305 - the same
# library HTTPS already uses, nothing more to build
ring = "0.17.14"
# sounds: WAV (PCM, ADPCM), MP3 and OGG decoded in pure Rust
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "adpcm", "mp3", "ogg", "vorbis"] }
# JPEG images (the menu's backgrounds, screenshots, workshop previews): pure Rust
zune-jpeg = "0.5.15"
# web pages (HTML panels, the main menu): Chromium, its build downloaded when built (CEF)
cef = "154.3.0"
# the sound card: WASAPI on Windows (Linux and macOS later)
cpal = "0.18.2"
# physics of props: pure Rust, no C++ to build
rapier3d = "0.36.0"
# fonts: the rasterizer, and the tables of font files (names, weights, Windows metrics)
fontdue = "0.9.4"
ttf-parser = "0.25.1"
# the GPU: Direct3D 12 and Vulkan only - no OpenGL, no Metal until macOS
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[profile.release]
opt-level = 3
debug = 1
codegen-units = 4
lto = "thin"

# The checks read every file of an installation (hundreds of thousands); an unoptimised build
# makes that minutes instead of seconds.
[profile.dev]
opt-level = 1
