[package]
name = "gmod-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Checks how much of a Garry's Mod installation openGMOD can read; browses the game file system"

[dependencies]
gmod-kv.workspace = true
gmod-fs.workspace = true
gmod-glua.workspace = true
gmod-bsp.workspace = true
gmod-material.workspace = true
gmod-model.workspace = true
gmod-world.workspace = true

[dev-dependencies]
gmod-bsp = { workspace = true, features = ["testmap"] }
