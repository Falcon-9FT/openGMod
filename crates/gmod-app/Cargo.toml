[package]
name = "gmod-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "opengmod: opens a Garry's Mod map from your installation to walk and fly around in"

[[bin]]
name = "opengmod"
path = "src/main.rs"

[dependencies]
gmod-fs.workspace = true
gmod-bsp.workspace = true
gmod-world.workspace = true
gmod-material.workspace = true
gmod-movement.workspace = true
gmod-render.workspace = true
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
gmod-bsp = { workspace = true, features = ["testmap"] }
