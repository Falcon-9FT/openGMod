[package]
name = "gmod-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "opengmod: a Garry's Mod map from your installation with the game's Lua and the addons running in it, to walk around in"

[[bin]]
name = "opengmod"
path = "src/main.rs"

[dependencies]
gmod-fs.workspace = true
gmod-bsp.workspace = true
gmod-world.workspace = true
gmod-lua.workspace = true
gmod-material.workspace = true
gmod-movement.workspace = true
gmod-render.workspace = true
wgpu.workspace = true
winit.workspace = true
gmod-audio.workspace = true
gmod-web.workspace = true
gmod-kv.workspace = true
gmod-net.workspace = true
serde.workspace = true
postcard.workspace = true

[target.'cfg(windows)'.dependencies]
cpal.workspace = true

[dev-dependencies]
gmod-bsp = { workspace = true, features = ["testmap"] }
