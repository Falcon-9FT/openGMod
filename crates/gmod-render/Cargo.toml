[package]
name = "gmod-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Draws a map on the GPU with wgpu (Direct3D 12, Vulkan as the fallback): the world, its 3D sky box and fog, posed models, view models"

[dependencies]
gmod-ui.workspace = true
gmod-world.workspace = true
wgpu.workspace = true

[dev-dependencies]
gmod-bsp = { workspace = true, features = ["testmap"] }
gmod-fs.workspace = true
gmod-material.workspace = true
# checks the shaders without a GPU
naga = { version = "30.0.0", features = ["wgsl-in"] }
