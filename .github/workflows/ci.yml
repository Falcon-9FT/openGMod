name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: [self-hosted, linux, rust]    # Docker-раннер
          - os: windows-latest
            runner: [self-hosted, windows]        # раннер прямо на Windows
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # Windows always has WARP, a software GPU: the GPU tests must run there, not skip
          OPENGMOD_REQUIRE_GPU: ${{ runner.os == 'Windows' && '1' || '' }}

  # the oldest Rust the workspace promises to build with (rust-version in Cargo.toml)
  msrv:
    runs-on: [self-hosted, linux, rust]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
