name: Release

# A version tag (v0.1.0, ...) builds the Windows programs and publishes them as a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
        env:
          OPENGMOD_REQUIRE_GPU: "1"
      - run: cargo build --release -p gmod-check -p gmod-app
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $programs = @("target/release/opengmod.exe", "target/release/gmod-check.exe")
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # the release exists (a re-run): replace the programs
            gh release upload $env:TAG @programs --clobber
          } else {
            gh release create $env:TAG @programs --title "openGMOD $env:TAG" --notes-file .github/release-notes.md --prerelease
          }
