name: Release

# Builds the Windows programs and publishes them as a release. Two ways to start it:
# * push a version tag (v0.2.0, ...);
# * "Run workflow" on the Actions tab: the tag is "v" and the workspace version from Cargo.toml,
#   made on the commit the workflow runs on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  windows:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
        env:
          OPENGMOD_REQUIRE_GPU: "1"
      - run: cargo build --release -p gmod-check -p gmod-app
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # opengmod.exe needs Chromium's files beside it: it goes out as a zip of them all;
          # gmod-check.exe alone, too. Chromium's files are where CEF's build downloaded them
          # (cef-dll-sys's out folder); target/release has them only when that build ran now,
          # not when it came from the cache
          $dist = "dist/openGMOD"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item target/release/opengmod.exe, target/release/gmod-check.exe $dist
          $cef = Get-ChildItem target/release/build -Directory -Filter "cef-dll-sys-*" |
            ForEach-Object { Join-Path $_.FullName "out/cef_windows_x86_64" } |
            Where-Object { Test-Path (Join-Path $_ "libcef.dll") } |
            Select-Object -First 1
          if (-not $cef) { $cef = "target/release" }
          Write-Output "Chromium's files from $cef"
          Get-ChildItem $cef -File |
            Where-Object { $_.Extension -in ".dll", ".pak", ".dat", ".bin" -or $_.Name -in "vk_swiftshader_icd.json", "CREDITS.html" } |
            Copy-Item -Destination $dist
          Copy-Item -Recurse (Join-Path $cef "locales") "$dist/locales"
          foreach ($needed in "libcef.dll", "icudtl.dat", "resources.pak", "locales/en-US.pak") {
            if (-not (Test-Path (Join-Path $dist $needed))) { Write-Error "$needed is missing from the release"; exit 1 }
          }
          # Windows' own tar.exe (bsdtar) makes the zip: Compress-Archive calls .NET methods,
          # which PowerShell's Constrained Language mode (on the self-hosted runner) forbids
          Remove-Item openGMOD-windows-x64.zip -ErrorAction SilentlyContinue
          tar.exe -a -c -f openGMOD-windows-x64.zip -C $dist (Get-ChildItem $dist).Name
          if ($LASTEXITCODE -ne 0) { Write-Error "zipping the release failed"; exit 1 }
          $programs = @("openGMOD-windows-x64.zip", "target/release/gmod-check.exe")
          if ($env:REF_TYPE -eq "tag") {
            $tag = $env:REF_NAME
          } else {
            $app = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq "gmod-app"
            $tag = "v$($app.version)"
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @programs --target $env:GITHUB_SHA --title "openGMOD $tag" --notes-file .github/release-notes.md --prerelease
          } elseif ($env:REF_TYPE -eq "tag") {
            # the release exists (a re-run): replace the programs
            gh release upload $tag @programs --clobber
          } else {
            Write-Error "$tag is out already: raise the version in Cargo.toml for a new release"
            exit 1
          }
